# SonarQube Configuration for Angular Admin
sonar.projectKey=fuse-angular-admin
sonar.projectName=Fuse Angular Admin Dashboard
sonar.projectVersion=18.0.0

# Source files
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Exclude test files, node_modules, dist, etc.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/e2e/**,**/cypress/**,**/out-tsc/**

# TypeScript/JavaScript settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test settings
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.typescript.tsconfigPath=tsconfig.json

# Quality Gate
sonar.qualitygate.wait=true

# Additional settings for Angular
sonar.typescript.file.suffixes=.ts
sonar.javascript.file.suffixes=.js