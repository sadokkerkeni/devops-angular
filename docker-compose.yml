version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: pfe-postgres
    environment:
      POSTGRES_DB: PfeProjectDb
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d PfeProjectDb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pfe-network

  # .NET API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pfe-api
    ports:
      - "5288:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=PfeProjectDb;Username=postgres;
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pfe-network

volumes:
  postgres_data:

networks:
  pfe-network:
    driver: bridge
